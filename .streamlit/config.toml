[theme]
# Vert NextMove (assorti aux boutons/accents du design iOS existant)
primaryColor = "#34C759"

# Fond clair iOS (assorti à src/design.py)
backgroundColor = "#F2F2F7"

# Fond secondaire (cartes, sidebar) — blanc
secondaryBackgroundColor = "#FFFFFF"

# Texte sombre pour lisibilité sur fond clair
textColor = "#1C1C1E"

# Police (DM Sans est chargée via Google Fonts dans design.py, ceci est le fallback)
font = "sans serif"

[server]
# Cohérent avec la limite réelle du plan gratuit Supabase (50MB, voir
# src/services/video_storage.py) — évite qu'un utilisateur tente un upload
# que Streamlit accepterait mais que Supabase rejetterait ensuite.
maxUploadSize = 50


[client]
# Masque le gros bouton "Deploy" en haut à droite
toolbarMode = "minimal"